[project]
name = "moresocial"
version = "0.1.0"
description = "Private relationship memory and gathering assistance"
requires-python = "==3.12.*"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.0",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pgvector==0.5.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "cryptography==50.0.1",
    "google-auth==2.58.1",
    "requests==2.34.2",
    "anthropic==1.8.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pgserver==0.1.4", "playwright==1.63.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
