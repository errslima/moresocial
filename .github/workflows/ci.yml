name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install PostgreSQL 17 client (backup/restore test must match the server major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Playwright system dependencies
        run: uv sync --frozen -p 3.12 && uv run --frozen playwright install --with-deps chromium
      - name: All checks (no production secrets)
        run: bash scripts/test.sh
      - name: Build images from the clean checkout
        run: |
          docker build -t moresocial-web:ci -f deploy/Dockerfile .
          docker build -t moresocial-connector:ci connector
          docker run --rm moresocial-web:ci python -c "import app.web, app.internal, worker.main"
          ! docker run --rm moresocial-web:ci sh -c 'ls /app/config /app/secrets 2>/dev/null | grep .'
